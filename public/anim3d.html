<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ARWA 3D</title>
<style>
  /* Waveguide rule: black = see-through. Thin bright lines, no fills, centre-weighted. */
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; font: 600 22px/1.2 system-ui, sans-serif; }
  canvas { display: block; }
  #top { position: absolute; top: 4%; left: 6%; right: 6%; text-align: center; }
  #top .d { font-weight: 500; font-size: .75em; color: #9ca3af; }
  body.boxed #top { zoom: 1.6; }
  body.boxed #fps { display: none; }
  #fps { position: absolute; bottom: 4px; right: 8px; font: 500 12px monospace; color: #555; }
</style>
</head>
<body>
<div id="box">
<div id="top"><div id="h"></div><div class="d" id="d"></div></div>
<div id="fps"></div>
</div>
<script src="/hud-layout.js"></script>
<script src="/vendor/three.min.js"></script>
<script>
// 3D on the M6: three.js r149 (WebGL1-capable, works in the Android 9 WebView), served by the laptop, no internet.
// Scenes:  ?scene=bolts  (cover-plate torque star pattern, ring/tap = next bolt)
//          ?scene=arrow  (3D arrow pointing at the next asset; ?deg=-40 to aim it)
// Options: ?mono=1 (single-colour waveguide), ?bolts=8 (4|6|8|12), ?nm=40 (torque shown), ?fps=30
var q = new URLSearchParams(location.search);
var MONO = q.get('mono') === '1' || (q.get('mono') !== '0' && !!window.ARWAGlasses); // M6 is green-only: use brightness
var C = MONO ? { on: 0xffffff, done: 0x3a3a3a, idle: 0x8a8a8a, plate: 0x5a5a5a, path: 0xbdbdbd }
             : { on: 0x22c55e, done: 0x4b5563, idle: 0xe5e7eb, plate: 0x38bdf8, path: 0xf59e0b };
var FPS = Number(q.get('fps') || 30);

var W = innerWidth, H = innerHeight;
var renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'low-power' });
renderer.setPixelRatio(1);            // 640x480 panel: never render more pixels than it has
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 1);  // black = transparent on the waveguide
document.getElementById('box').appendChild(renderer.domElement);
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
camera.position.set(0, 0, 9);
addEventListener('resize', function () { W = innerWidth; H = innerHeight; renderer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix(); });

function lineMat(c, o) { return new THREE.LineBasicMaterial({ color: c, transparent: o != null, opacity: o == null ? 1 : o }); }
function edges(geo, c) { return new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat(c)); }
function setText(h, d) { document.getElementById('h').textContent = h; document.getElementById('d').textContent = d || ''; }

// ---------- Scene 1: cover-plate bolts in a star (cross) tightening pattern ----------
function starOrder(n) { // standard cross pattern: 1, opposite, then quarter-turns
  if (n === 4) return [0, 2, 1, 3];
  if (n === 6) return [0, 3, 1, 4, 2, 5];
  if (n === 8) return [0, 4, 2, 6, 1, 5, 3, 7];
  if (n === 12) return [0, 6, 3, 9, 1, 7, 4, 10, 2, 8, 5, 11];
  var o = []; for (var i = 0; i < n; i++) o.push(i); return o;
}
function boltsScene() {
  var n = Number(q.get('bolts') || 8), nm = q.get('nm') || '40';
  var order = starOrder(n), cur = 0, R = 2.4;
  var rig = new THREE.Group(); scene.add(rig);
  rig.rotation.x = -0.75; // tilt so the plate reads as 3D, like looking down at a flange

  // plate: outer rim, inner bore, and a thin cylinder edge for depth
  var rim = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(new THREE.Path().absarc(0, 0, R + 0.7, 0, Math.PI * 2).getSpacedPoints(64)), lineMat(C.plate));
  var bore = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(new THREE.Path().absarc(0, 0, R - 0.9, 0, Math.PI * 2).getSpacedPoints(48)), lineMat(C.plate, 0.6));
  var side = edges(new THREE.CylinderGeometry(R + 0.7, R + 0.7, 0.25, 48, 1, true), C.plate); side.rotation.x = Math.PI / 2; side.position.z = -0.13; side.material.transparent = true; side.material.opacity = 0.35;
  rig.add(rim, bore, side);

  var hexGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.35, 6); hexGeo.rotateX(Math.PI / 2);
  var bolts = [];
  for (var i = 0; i < n; i++) {
    var a = Math.PI / 2 - (i / n) * Math.PI * 2; // bolt 0 at 12 o'clock, clockwise
    var b = edges(hexGeo, C.idle);
    b.position.set(Math.cos(a) * R, Math.sin(a) * R, 0.2);
    rig.add(b); bolts.push(b);
  }
  // path through the sequence so far (dashed amber line)
  var pathGeo = new THREE.BufferGeometry(); var pathPts = new Float32Array(n * 3);
  pathGeo.setAttribute('position', new THREE.BufferAttribute(pathPts, 3)); pathGeo.setDrawRange(0, 0);
  var path = new THREE.Line(pathGeo, new THREE.LineDashedMaterial({ color: C.path, dashSize: 0.18, gapSize: 0.12 }));
  rig.add(path);
  // spinning wrench ring around the active bolt
  var ring = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(new THREE.Path().absarc(0, 0, 0.55, 0, Math.PI * 1.6).getSpacedPoints(24)), lineMat(C.on));
  rig.add(ring);

  function show() {
    for (var i = 0; i < n; i++) bolts[i].material.color.setHex(C.idle);
    for (var k = 0; k < Math.min(cur, n); k++) bolts[order[k]].material.color.setHex(C.done);
    for (var k2 = 0; k2 <= Math.min(cur, n - 1); k2++) { var p = bolts[order[k2]].position; pathPts.set([p.x, p.y, 0.25], k2 * 3); }
    pathGeo.attributes.position.needsUpdate = true; pathGeo.setDrawRange(0, Math.min(cur + 1, n)); path.computeLineDistances();
    if (cur < n) {
      bolts[order[cur]].material.color.setHex(C.on);
      setText('Bolt ' + (order[cur] + 1) + ' · ' + (cur + 1) + ' of ' + n, 'Star pattern · ' + nm + ' N·m · tap when torqued');
    } else setText('✓ All ' + n + ' bolts torqued', 'Pass 1 done · tap to restart');
    ring.visible = cur < n;
  }
  window.arwaConfirm = function () { cur = cur >= n ? 0 : cur + 1; show(); };
  window.arwaExpert = function () { cur = Math.max(0, cur - 1); show(); };
  show();

  return function tick(t) {
    rig.rotation.z = Math.sin(t * 0.25) * 0.15;         // slow sway so depth reads
    rig.rotation.x = -0.75 + Math.sin(t * 0.4) * 0.05;
    if (cur < n) {
      var b = bolts[order[cur]];
      b.rotation.z = -t * 3;                               // bolt turns like it's being torqued
      b.position.z = 0.2 + Math.abs(Math.sin(t * 3)) * 0.12;
      ring.position.set(b.position.x, b.position.y, 0.3); ring.rotation.z = -t * 3;
      var s = 1 + Math.sin(t * 6) * 0.08; ring.scale.set(s, s, 1);
    }
    for (var i = 0; i < n; i++) if (cur >= n || i !== order[cur]) { bolts[i].rotation.z *= 0.9; bolts[i].position.z += (0.2 - bolts[i].position.z) * 0.2; }
  };
}

// ---------- Scene 2: 3D wayfinding arrow ----------
function arrowScene() {
  var deg = Number(q.get('deg') || -35), label = q.get('label') || 'Machine 3A · 4 m';
  var g = new THREE.Group(); scene.add(g);
  var shape = new THREE.Shape();
  shape.moveTo(0, 1.6); shape.lineTo(1.1, 0.4); shape.lineTo(0.4, 0.4); shape.lineTo(0.4, -1.4);
  shape.lineTo(-0.4, -1.4); shape.lineTo(-0.4, 0.4); shape.lineTo(-1.1, 0.4); shape.lineTo(0, 1.6);
  var geo = new THREE.ExtrudeGeometry(shape, { depth: 0.4, bevelEnabled: false }); geo.center();
  var arrow = edges(geo, C.on); g.add(arrow);
  // floor grid so the arrow sits in space
  var grid = new THREE.GridHelper(10, 10, C.plate, C.plate); grid.material.transparent = true; grid.material.opacity = 0.25; grid.position.y = -2; scene.add(grid);
  setText(label, (deg < 0 ? 'Turn right ' : 'Turn left ') + Math.abs(deg) + '°');
  window.arwaConfirm = function () { deg = -deg; setText(label, (deg < 0 ? 'Turn right ' : 'Turn left ') + Math.abs(deg) + '°'); };
  return function tick(t) {
    g.rotation.x = -Math.PI / 2 + 0.5;                    // lie the arrow on the floor, tipped toward the viewer
    g.rotation.z = THREE.MathUtils.degToRad(deg);
    g.position.z = Math.sin(t * 2) * 0.3;                  // gentle forward pulse
    arrow.material.opacity = 1;
    grid.position.z = (t * 0.8) % 1;                        // floor slides toward you: "keep walking"
  };
}

var tick = (q.get('scene') === 'arrow' ? arrowScene : boltsScene)();

// Input: ring/touchpad keys arrive via the M6 app (it calls arwaConfirm/arwaExpert); keyboard + tap for laptop testing.
addEventListener('keydown', function (e) {
  if (['Enter', ' ', 'ArrowRight', 'PageDown'].indexOf(e.key) >= 0) window.arwaConfirm();
  if (['ArrowLeft', 'PageUp', 'e'].indexOf(e.key) >= 0 && window.arwaExpert) window.arwaExpert();
});
addEventListener('click', function () { window.arwaConfirm(); });

// Render loop capped at FPS (30 default) to spare the watch-class chip; paused when hidden.
var last = 0, frames = 0, fpsT = 0, fpsEl = document.getElementById('fps');
function loop(ms) {
  requestAnimationFrame(loop);
  if (document.hidden || ms - last < 1000 / FPS - 2) return;
  last = ms; var t = ms / 1000;
  tick(t); renderer.render(scene, camera);
  frames++; if (ms - fpsT > 1000) { fpsEl.textContent = frames + ' fps'; frames = 0; fpsT = ms; }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
